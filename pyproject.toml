[project]
name = "scampi"

version = "0.1.2"

description = "SCAMPI - Fast Pattern Discovery in Massive Time Series"
readme = "README.md"
authors = [
    {name = "XYZ", email = "do-not-mail@anonymous.com"}
]
keywords = [
    "machine-learning",
    "time-series",    
    "motif-discovery",
    "motif-sets",
    "motif-pairs",
    "pattern-discovery",
    "unsupervised",
    "LSH"
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "joblib>=1.1.0",
    "numba>=0.55.1",
    "numpy>=1.21.0",
    "pandas>=1.1.0",
    "scikit-learn>=0.24.0",
    "scipy<2.0.0",
    "seaborn>=0.11.2",
    "tqdm>=4.63.0",
    "matplotlib>=3.5.1",
    "tsdownsample>=0.1.3",
    "pyattimo>=0.8.1"
]

[project.urls]
repository = "https://github.com/patrickzib/scampi"

[project.license]
file = "LICENSE"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["scampi*", "benchmarks*", "competitors*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
scampi = [
    "*.csv",
    "*.csv.gz",
    "*.arff",
    "*.arff.gz",
    "*.txt",
    "*.ts",
    "*.tsv",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
